name: iPhone Safari preview

on:
  push:
    branches: [test/ios-safari-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    if: github.repository == 'Paul1404/QR-Redirects'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create test project and select an iPhone
        run: |
          python3 tests/ios/create_project.py
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode.txt
          xcrun simctl list devices available -j > artifacts/devices.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('artifacts/devices.json').read_text())
          candidates = [(runtime, d) for runtime, devices in data['devices'].items() if 'iOS-26-2' in runtime for d in devices if d['name'] == 'iPhone 16' and d.get('isAvailable')]
          assert candidates, 'No iPhone 16 with iOS 26.2 is available on this runner'
          runtime, device = candidates[0]
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + device['udid'] + '\n')
          Path('artifacts/device.txt').write_text(device['name'] + '\n' + runtime + '\n' + device['udid'] + '\n')
          print(device['name'], runtime)
          PY
      - name: Boot iOS and open the live fork preview
        run: |
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl openurl "$SIMULATOR_ID" 'https://paul1404.github.io/QR-Redirects/01/hy-alarm?ios=ec4dbcd'
      - name: Run native Safari UI tests
        run: |
          set -o pipefail
          xcodebuild test -project tests/ios/SafariPreview.xcodeproj -scheme SafariPreview -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath artifacts/Safari.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/test.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d artifacts/Safari.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/Safari.xcresult --output-path artifacts/screenshots || true
          fi
          if [ -n "$SIMULATOR_ID" ]; then
            xcrun simctl io "$SIMULATOR_ID" screenshot artifacts/final-screen.png || true
            xcrun simctl shutdown "$SIMULATOR_ID" || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iphone-safari-results
          path: |
            artifacts/screenshots/*.png
            artifacts/screenshots/*.txt
            artifacts/screenshots/manifest.json
            artifacts/*.txt
            artifacts/*.log
            artifacts/final-screen.png
          retention-days: 3
